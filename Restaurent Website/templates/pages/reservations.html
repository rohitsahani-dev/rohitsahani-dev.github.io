{% extends 'base.html' %}

{% block content %}
<section class="page-hero compact">
    <div class="container">
        <span class="eyebrow">Reservations</span>
        <h1>Reserve your table in seconds.</h1>
        <p>Submit your reservation request with date, time, and party size. The reservation is saved to the database for staff review.</p>
    </div>
</section>

<section class="section">
    <div class="container narrow-container">
        <form id="reservation-form" class="content-card form-card">
            <div class="form-grid two-column">
                <div class="form-field">
                    <label for="reservation-name">Name</label>
                    <input id="reservation-name" name="name" type="text" required>
                </div>
                <div class="form-field">
                    <label for="reservation-email">Email</label>
                    <input id="reservation-email" name="email" type="email" value="{{ current_user.email if current_user.is_authenticated else '' }}" required>
                </div>
                <div class="form-field">
                    <label for="reservation-phone">Phone</label>
                    <input id="reservation-phone" name="phone" type="tel" required>
                </div>
                <div class="form-field">
                    <label for="reservation-party">Party Size</label>
                    <input id="reservation-party" name="party_size" type="number" min="1" max="20" required>
                </div>
                <div class="form-field full-width">
                    <label for="reservation-date">Reservation Date and Time</label>
                    <input id="reservation-date" name="reservation_at" type="datetime-local" required>
                </div>
                <div class="form-field full-width">
                    <label for="reservation-notes">Notes</label>
                    <textarea id="reservation-notes" name="notes" rows="5" placeholder="Any preferences or special occasion details"></textarea>
                </div>
            </div>
            <button class="button button-primary" type="submit">Submit Reservation</button>
        </form>
    </div>
</section>
{% endblock %}
