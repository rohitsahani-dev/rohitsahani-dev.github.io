{% if pagination.pages > 1 %}
<div class="pagination">
    {% if pagination.has_prev %}
        <a class="button button-secondary" href="{{ url_for(request.endpoint, page=pagination.prev_num) }}">Previous</a>
    {% endif %}
    <span>Page {{ pagination.page }} of {{ pagination.pages }}</span>
    {% if pagination.has_next %}
        <a class="button button-secondary" href="{{ url_for(request.endpoint, page=pagination.next_num) }}">Next</a>
    {% endif %}
</div>
{% endif %}
