<header class="site-header">
    <div class="container nav-shell">
        <a class="brand" href="{{ url_for('pages.home') }}">
            <span class="brand-mark"><i class="fas fa-utensils"></i></span>
            <span class="brand-text">La Bella Italia</span>
        </a>
        <button class="nav-toggle" type="button" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="main-nav">
            <a href="{{ url_for('pages.home') }}">Home</a>
            <a href="{{ url_for('pages.menu') }}">Menu</a>
            <a href="{{ url_for('pages.reservations') }}">Reservations</a>
            <a href="{{ url_for('pages.contact') }}">Contact</a>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('pages.order_history') }}">Orders</a>
                {% if current_user.role == 'admin' %}
                    <a href="{{ url_for('pages.admin_dashboard') }}">Admin</a>
                {% endif %}
            {% endif %}
        </nav>
        <div class="nav-actions">
            {% if current_user.is_authenticated %}
                <span class="nav-user">Hi, {{ current_user.name.split(' ')[0] }}</span>
                <button class="button button-secondary" type="button" data-logout-button>Logout</button>
            {% else %}
                <a class="button button-secondary" href="{{ url_for('auth.login_page') }}">Login</a>
                <a class="button button-primary" href="{{ url_for('auth.register_page') }}">Register</a>
            {% endif %}
        </div>
    </div>
</header>
