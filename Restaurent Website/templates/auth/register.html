{% extends 'base.html' %}

{% block content %}
<section class="section auth-shell">
    <div class="container narrow-container">
        <form id="register-form" class="content-card form-card">
            <span class="eyebrow">Create Account</span>
            <h1>Join the restaurant platform.</h1>
            <div class="form-grid">
                <div class="form-field">
                    <label for="register-name">Full Name</label>
                    <input id="register-name" name="name" type="text" required>
                </div>
                <div class="form-field">
                    <label for="register-email">Email</label>
                    <input id="register-email" name="email" type="email" required>
                </div>
                <div class="form-field">
                    <label for="register-password">Password</label>
                    <input id="register-password" name="password" type="password" required>
                </div>
                <div class="form-field">
                    <label for="register-confirm-password">Confirm Password</label>
                    <input id="register-confirm-password" name="confirm_password" type="password" required>
                </div>
            </div>
            <button class="button button-primary" type="submit">Register</button>
            <p class="helper-text">Already have an account? <a href="{{ url_for('auth.login_page') }}">Login here</a>.</p>
        </form>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
