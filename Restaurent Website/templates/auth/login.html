{% extends 'base.html' %}

{% block content %}
<section class="section auth-shell">
    <div class="container narrow-container">
        <form id="login-form" class="content-card form-card">
            <span class="eyebrow">Customer Login</span>
            <h1>Welcome back.</h1>
            <div class="form-grid">
                <div class="form-field">
                    <label for="login-email">Email</label>
                    <input id="login-email" name="email" type="email" required>
                </div>
                <div class="form-field">
                    <label for="login-password">Password</label>
                    <input id="login-password" name="password" type="password" required>
                </div>
            </div>
            <button class="button button-primary" type="submit">Login</button>
            <p class="helper-text">Need an account? <a href="{{ url_for('auth.register_page') }}">Register here</a>.</p>
        </form>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
